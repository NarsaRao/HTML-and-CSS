<!DOCTYPE html>
<html>
    <head>
<title> Youtube Clone</title></head>
<link rel="stylesheet" href="buttons.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nata+Sans:wght@100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
<body>
          <input  class="search" type="text" placeholder="Search">
    <div class="videopreview">
        <div class="thumb"><img class="thumbnail-1" src="images/thumbnail-1.webp" alt="video-thumbnail">
        </div>
        <div>
            <div class="dpcontain">
                <img class="dp" src="channelpictures/marquesbrown.png">
            </div>
            <div class="videoinfocontain">
                <p class="videotitle">
                    Talking Tech and AI with Google CEO Sundar Pichai!
                </p>
                <p class="videochannel">Marques Brownlee &#10004;</p>
                <p class="videostats"> 3.4M views  &#8226; 6 months ago</p>
            </div>
        </div>
    </div>
    <div class="videopreview">
        <div class="thumb"><img class="thumbnail-1" src="images/markplier.png" alt="video-thumbnail">
        </div>
        <div>
            <div class="dpcontain">
                <img class="dp" src="channelpictures/mark.png">
            </div>
            <div class="videoinfocontain">
                <p class="videotitle">
                    Talking Tech and AI with Google CEO Sundar Pichai!
                </p>
                <p class="videochannel">Markiplier &#10004;</p>
                <p class="videostats"> 6.8 views  &#8226; 6 months ago</p>
            </div>
        </div>
    </div>
            
           
</body>
</html>
