<!DOCTYPE html>
<html>
    <head>
<title>Grid Practice</title>
    </head>
    <body>
        <div style="
            display:grid;
            grid-template-columns: 1fr 1fr;">
            <div style="background-color: rgb(116, 116, 255);">div1</div>
            <div style="background-color: lightpink;">div2</div>
        </div>
        <div style="
           margin-top:30px;
            display:grid;
            grid-template-columns: 100px 100px;">
            <div style="background-color: rgb(116, 116, 255);">div1</div>
            <div style="background-color: lightpink;">div2</div>
        </div>
    </body>
</html>
